{% extends "base.html" %}

{% block content %}
<div class="card mb-3" style="max-width: 540px;">
  <div class="row g-0">
    <div class="col-md-4">
      <img src="{{ data.product_img }}" class="img-fluid rounded-start" alt="">
    </div>
    <div class="col-md-8">
      <div class="card-body">
        <h2 class="card-title">{{ data.name }}</h2>
          <h5 class="card-title">{{ data.category }}</h5>
          <h5 class="card-title">{{ data.price }}</h5>
          <div class="card-text mt-3">
            <pre style="font-family: inherit; white-space: pre-wrap;">{{ data.description }}</pre>
          </div>
          <p class="card-text mt-auto"><small class="text-muted">added: {{ data.create_date }}</small></p>
          <div class="mt-3 d-flex gap-2">
          <a href="{% url 'product_edit' data.pk %}" class="btn btn-warning btn-sm">Edit</a>
          <form method="post" action="{% url 'product_detail' data.pk %}" style="display:inline;">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger btn-sm">
              Delete
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
