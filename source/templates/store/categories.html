{% extends "base.html" %}

{% block content %}
<table class="table table-striped">
  <tbody>
  {% for category in data %}
    <tr>
      <td><a class="nav-link" href="{% url 'category_product' category.name %}">{{ category.name }}</a></td>{
      <td> <a class="nav-link" href="{% url 'category_edit' category.pk %}">Edit</a></td>
      <td>
          <form method="post" action="{% url 'category_detail' category.pk %}" style="display:inline;">
          {% csrf_token %}
              <button type="submit" class="btn btn-danger btn-sm">Delete</button>
          </form>
      </td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
